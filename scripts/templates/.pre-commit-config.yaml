# Hooks de qualidade de codigo executados LOCALMENTE antes de cada commit.
# Rodam sem gasto de token de LLM. As versoes sao fixadas por hook para
# garantir reprodutibilidade entre maquinas.
#
# Instalacao (uma vez por clone), a partir da pasta do agente:
#   uv run pre-commit install
#   uv run pre-commit install --hook-type commit-msg
# Rodar em tudo manualmente:
#   uv run pre-commit run --all-files

repos:
  # Higiene geral de arquivos.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  # Lint + format (Ruff substitui Flake8/isort/pyupgrade/Black).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Checagem estatica de tipos.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies: []

  # SAST: padroes inseguros no codigo (nao roda em tests/).
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "src"]
        additional_dependencies: ["bandit[toml]"]

  # Impede que segredos vazem em commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Arquitetura: garante a direcao de dependencia das camadas.
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (contratos de arquitetura)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true

  # Conventional Commits (valida a mensagem de commit).
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
